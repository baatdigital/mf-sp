name: CI - Lint + Test + Build

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: Lint + Test + Build
    runs-on: [self-hosted, holding]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Unit tests (Karma headless)
        run: yarn test --browsers=ChromeHeadlessNoSandbox --watch=false --code-coverage
        env:
          CHROME_BIN: /usr/bin/google-chrome-stable

      - name: Federation publishes a major range, not an exact version
        # A remote that demands an exact @angular/* version cannot share one
        # copy with a host a patch away: both load their own Angular (NG0203)
        # and the routes render as "Esta seccion no existe".
        run: yarn check:federation
      - name: Build production
        run: yarn build:prod
