name: Deploy Micro-Frontend to CDN

# Directive 2026-08-20 (Cesar): production is no longer deployed by pushing,
# and every release carries a version. Directive 2026-08-20: "todo debe estar
# en aws secrets" -- for a deploy credential the right answer is stronger than
# a stored secret, it is no secret at all. This workflow authenticates with
# GitHub OIDC against a role scoped to THIS repo's prefix and distribution, so
# a copied workflow file cannot obtain another microfrontend's credentials.
#
#   push to main        -> build only, proves main compiles. Deploys nothing.
#   workflow_dispatch   -> production, after a human approves the `production`
#                          environment.
#   release: published  -> same production path.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, semver with the v (e.g. v1.4.2)."
        required: true
  release:
    types: [published]
permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '20'
  MODULE_NAME: 'sp'
  CDN_BUCKET: 'cdn-superpago-microfrontends'
  AWS_REGION: 'us-east-1'
  CLOUDFRONT_DISTRIBUTION_ID: 'E3A0H41AD1MAWR'

concurrency:
  group: deploy-cdn-${{ github.event.repository.name }}-${{ github.ref_name }}-prod
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # A push can never reach production. The environment gate stops even a
    # human dispatch until it is approved, and the OIDC role will not issue
    # credentials to a job running outside that environment.
    if: github.event_name != 'push'
    environment: production
    name: Build and Deploy
    runs-on: [self-hosted, holding]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Skip if commit superseded
        id: guard
        run: |
          BRANCH="${{ github.ref_name }}"
          SHA="${{ github.sha }}"
          git fetch origin "$BRANCH" --quiet
          LATEST=$(git rev-parse origin/"$BRANCH")
          if [ "$LATEST" = "$SHA" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Commit $SHA superseded by $LATEST on $BRANCH - skipping deploy"
          fi

      - name: Setup Node.js
        if: steps.guard.outputs.is_latest == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        if: steps.guard.outputs.is_latest == 'true'
        run: yarn install --frozen-lockfile

      - name: Build for production
        if: steps.guard.outputs.is_latest == 'true'
        run: yarn build:prod
        env:
          CI: true

      - name: Prepare files for deploy
        if: steps.guard.outputs.is_latest == 'true'
        run: |
          cd dist/mf-${{ env.MODULE_NAME }}/browser
          MAIN_FILE=$(ls main-*.js 2>/dev/null | head -1)
          if [ -n "$MAIN_FILE" ]; then
            echo "Renaming $MAIN_FILE to main.js"
            cp "$MAIN_FILE" main.js
          fi
          echo "Files to deploy:"
          ls -la

      - name: Configure AWS credentials
        if: steps.guard.outputs.is_latest == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::705262650738:role/superpago-gha-mf-sp
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        if: steps.guard.outputs.is_latest == 'true'
        run: |
          DEPLOY_PATH="mf/${{ env.MODULE_NAME }}"
          echo "Deploying to s3://${{ env.CDN_BUCKET }}/${DEPLOY_PATH}"
          aws s3 sync dist/mf-${{ env.MODULE_NAME }}/browser \
            s3://${{ env.CDN_BUCKET }}/${DEPLOY_PATH} \
            --delete \
            --cache-control "public, max-age=300"

      - name: Keep an immutable copy of this version
        env:
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Version '$VERSION' is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          RELEASE="s3://${{ env.CDN_BUCKET }}/releases/sp/${VERSION}"
          if [ -n "$(aws s3 ls "$RELEASE/" 2>/dev/null)" ]; then
            echo "::error::$RELEASE already exists. A version is a promise about which bytes shipped; pick a new one."
            exit 1
          fi
          aws s3 sync dist/mf-${{ env.MODULE_NAME }}/browser "$RELEASE" \
            --cache-control "public, max-age=31536000, immutable"
          echo "Rollback: re-sync $RELEASE over s3://${{ env.CDN_BUCKET }}/mf/sp"

      - name: Invalidate CloudFront cache
        if: steps.guard.outputs.is_latest == 'true'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ env.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/mf/${{ env.MODULE_NAME }}/*"

      - name: Deploy summary
        if: steps.guard.outputs.is_latest == 'true'
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Module** | mf-${{ env.MODULE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **CDN URL** | https://mf.superpago.com.mx/mf/${{ env.MODULE_NAME }}/remoteEntry.json |" >> $GITHUB_STEP_SUMMARY
